# Generated by `tbo_replay --dump-params`: every numeric parameter of the estimator.
tram_backup_odometry:
  ros__parameters:
    map_file: "maps/track_map.csv"
    traction_file: "config/traction_lut.csv"
    branch_files: "maps/branch_fan_F2.csv,maps/branch_fan_F3.csv,maps/branch_wb_detour.csv"
    landmark_file: "maps/landmarks.csv"
    cutoff_file: "maps/cutoffs.csv"
    dfield_file: "maps/dfield.csv"
    fault_prior_file: ""
    gl_stops_file: "maps/gl_stops.csv"
    gl_cutoffs_file: "maps/gl_cutoffs.csv"
    speed_envelope_file: "maps/speed_envelope.csv"
    stub_file: "maps/stub_west_arrival_2.csv"
    output_frame: "mgrs"         # mgrs (jury, Autoware map frame) | enu | utm | map
    init_source: "master"        # GNSS antenna used for the initial fix
    frame_id: "map"
    child_frame_id: "base_link"
    wheel_kmh_to_ms: 0.2778805556  # nominal bogie speed calibration [m/s per km/h]
    wheel_curv_abs: 0.415  # wheel under-reading in curves, |curvature| coefficient [m]
    wheel_curv_signed: -0.054  # wheel under-reading in curves, signed curvature coefficient [m]
    wheel_curv_sat: 0.009  # saturation of the curve correction [-]
    front_bogie_along_m: 9.873  # front bogie ahead of antenna 1 [m]
    rear_bogie_along_m: 2.323  # rear bogie ahead of antenna 1 [m]
    body_rear_m: -2.1  # car body rear end relative to antenna 1 [m]
    body_front_m: 14.4  # car body front end relative to antenna 1 [m]
    wheel_max_kmh: 110.0  # readings above are rejected as invalid [km/h]
    wheel_delay_s: 0.0  # bogie speed latency compensation [s]
    cmd_delay_s: 0.0  # notch -> drive dead time [s]
    lag_window_s: 0.3  # fixed-lag window for out-of-order messages [s]
    max_step_s: 0.05  # max integration step [s]
    wheel_timeout_s: 0.6  # bogie dropout timeout [s]
    cmd_timeout_s: 0.6  # controller dropout timeout [s]
    max_future_s: 5.0  # stamps further ahead need a confirming message [s]
    max_backjump_s: 10.0  # stamps further back need a confirming message (then new run) [s]
    jump_confirm_s: 1.0  # two messages this close confirm a time-base jump [s]
    new_run_gap_s: 60.0  # confirmed forward jump that starts a new run [s]
    sigma_accel: 0.12  # model acceleration white noise [m/s^2]
    q_disturbance: 0.004  # disturbance random walk [(m/s^2)^2/s]
    q_scale: 1e-09  # wheel scale random walk [1/s]
    q_along: 0.0  # along-track random walk per metre travelled [m^2/m]
    q_gain: 2e-05  # traction gain random walk [1/s]
    init_sigma_v: 0.3  # initial speed sigma [m/s]
    init_sigma_d: 0.1  # initial disturbance sigma [m/s^2]
    init_sigma_scale: 0.015  # initial wheel scale sigma [-]
    init_sigma_gain: 0.08  # initial traction gain sigma [-]
    gain_min: 0.6  # traction gain lower clamp [-]
    gain_max: 1.6  # traction gain upper clamp [-]
    disturbance_max: 0.6  # max unexplained acceleration (beyond = slip) [m/s^2]
    disturbance_max_decel: 4.0  # max unexplained deceleration (emergency brake) [m/s^2]
    sigma_wheel: 0.05  # bogie speed noise [m/s]
    sigma_wheel_rel: 0.004  # relative bogie speed noise [-]
    outlier_range: 30.0  # uniform outlier density support [m/s]
    rate_to_bad: 0.05  # IMM nominal -> one bad [1/s]
    rate_to_both_bad: 0.01  # IMM nominal -> both bad [1/s]
    rate_recover: 0.7  # IMM bad -> nominal [1/s]
    mode_prob_floor: 1e-06  # IMM probability floor [-]
    slip_context_boost: 4.0  # rate boost under high effort [-]
    fault_prior_max: 4.0  # cap of the place-dependent fault-rate multiplier [-]
    rate_to_maneuver: 0.01  # IMM nominal -> maneuver (unmodelled acceleration) [1/s]
    rate_maneuver_end: 0.5  # IMM maneuver -> nominal [1/s]
    sigma_accel_maneuver: 0.5  # acceleration noise in maneuver mode [m/s^2]
    q_disturbance_maneuver: 8.0  # disturbance random walk in maneuver mode [(m/s^2)^2/s]
    wrong_sign_penalty: 3.0  # log-penalty for impossible-sign fault residual [-]
    max_wheel_accel: 6.0  # implausible bogie acceleration [m/s^2]
    stuck_time_s: 0.8  # frozen reading duration [s]
    stuck_min_change: 0.0  # speed change proving a frozen reading [m/s]
    zero_stuck_other: 0.5  # other bogie speed proving a zero reading dead [m/s]
    single_bogie_latch_mult: 2.0  # latch threshold multiplier with one live bogie [-]
    cusum_slip_accel: 0.6  # CUSUM: tolerated excess accel under traction [m/s^2]
    cusum_slide_accel: 0.8  # CUSUM: tolerated extra decel under braking [m/s^2]
    cusum_h: 0.3  # CUSUM alarm threshold [m/s]
    cmd_fault_accel: 0.5  # impossible-sign excess indicting the controller [m/s^2]
    cmd_fault_h: 0.4  # accumulated excess raising controller fault [m/s]
    cmd_fault_hold_s: 8.0  # controller distrust hold time [s]
    disturbance_max_free: 2.0  # max unexplained accel when not under traction [m/s^2]
    latch_release_abs: 0.3  # latch release gate (absolute) [m/s]
    latch_release_rel: 0.04  # latch release gate (relative) [-]
    latch_release_n: 2.0  # consistent samples to release latch [-]
    latch_max_s: 10.0  # max joint anomaly bridged by the model [s]
    slide_latch_max_s: 10.0  # max joint slide bridged by the model [s]
    slide_ref_fast: 1.0  # slide monitor reference: filter disturbance (1) or slow copy (0) [bool]
    slide_ref_tau_s: 0.0  # low-pass time constant of the slide reference (0 = raw) [s]
    slide_fast_max_noise: 0.1  # bogie noise level above which the slide reference is the slow copy [m/s]
    standstill_kmh: 0.15  # standstill threshold [km/h]
    standstill_time_s: 0.25  # standstill confirmation time [s]
    standstill_max_v: 1.2  # lock-up guard for standstill [m/s]
    recover_time_s: 3.0  # consistency time before re-anchoring [s]
    recover_agree: 0.35  # front/rear agreement for re-anchoring [m/s]
    recover_min_bad_s: 5.0  # min anomaly duration before re-anchoring [s]
    drive_tau_s: 0.452  # drive acceleration lag [s]
    map_grade_gain: 1.0  # gain of the map grade term in the dynamics [-]
    kg_brake: 8.22  # grade coefficient under braking [m/s^2]
    kg_coast: 7.98  # grade coefficient when coasting [m/s^2]
    kg_traction: 7.36  # grade coefficient under traction [m/s^2]
    curve_resist_coef: 0.0  # curve resistance coefficient (0 = off) [m^2/s^2]
    dfield_gain: 1.0  # weight of the learned disturbance field d(s) [-]
    grade_s_coupling: 0.0  # EKF Jacobian includes d(grade accel)/ds [bool]
    gnss_init_window_s: 5.0  # GNSS accepted only this long after the first fix [s]
    global_loc_enable: 1.0  # GNSS-free global localisation when no fix arrives [bool]
    nognss_relative: 0.0  # publish relative odometry before a GNSS-free fix [bool]
    gnss_wait_s: 4.0  # position withheld this long waiting for the first fix [s]
    gnss_min_fixes: 3.0  # fixes needed for initialisation [-]
    map_gate_m: 25.0  # init fix to map distance gate [m]
    map_heading_gate_deg: 60.0  # init heading consistency gate [deg]
    map_sigma_cross: 0.3  # map cross-track sigma [m]
    map_sigma_z: 0.5  # map altitude sigma [m]
    init_sigma_s: 1.0  # along-track sigma after init [m]
    init_sigma_s_per_m: 0.7  # extra along-track sigma per metre of init fix-to-map distance [-]
    use_baseline_heading: 1.0  # use master-rover baseline to pick direction [bool]
    landmark_enable: 1.0  # use stop landmarks as along-track fixes [bool]
    landmark_dwell_s: 1.5  # standstill before a landmark fix [s]
    landmark_gate_sigma: 3.0  # landmark association gate [sigma]
    landmark_min_prob: 0.6  # landmark association posterior threshold [-]
    landmark_p_random: 0.15  # share of stops not at a landmark [-]
    landmark_sigma_extra: 0.3  # extra landmark position sigma [m]
    landmark_assoc_q: 0.008  # association variance growth per metre since the last place fix [m^2/m]
    stub_enable: 1.0  # dead-end stub: take a far stop past its start as being on it (1 on) [-]
    stub_stop_min_m: 85.0  # dead-end stub: nearest stop past its start that means the stub [m]
    stub_stop_max_m: 135.0  # dead-end stub: farthest stop past its start that means the stub [m]
    stub_rough_min: 0.013  # dead-end stub: rms log(front/rear) at the switch that means the stub (0 off) [-]
    stub_rough_from_m: -15.0  # dead-end stub: roughness window start, antenna arc from the stub start [m]
    stub_rough_to_m: 12.0  # dead-end stub: roughness window end, antenna arc from the stub start [m]
    stub_rough_max_noise: 0.05  # dead-end stub: roughness test skipped above this slow bogie noise [m/s]
    landmark_max_dk: 0.004  # max wheel-scale change per landmark fix [-]
    cutoff_enable: 1.0  # use traction cut-off landmarks [bool]
    cutoff_notch: 4.0  # min notch before an abrupt cut to 0 [-]
    cutoff_min_v: 2.0  # min speed for a cut-off fix [m/s]
    cutoff_p_random: 0.05  # share of cut-offs away from known places [-]
    position_lead_s: 0.045  # position published for stamp + lead (reference fix timing) [s]
    speed_output_delay_s: 0.1  # published speed is that of stamp - delay (judge reference lag) [s]
    position_output_delay_s: 0.08  # published position is that of stamp - delay (judge reference lag) [s]
    speed_var_scale: 0.32  # published speed variance scale (consistency calibration) [-]
    speed_var_floor: 0.00025  # published speed variance floor [(m/s)^2]
    protection_k: 5.76  # 99 % along-track protection level in sigma_s [-]
    mgrs_zone: 37.0  # UTM zone of the MGRS output frame [-]
    mgrs_origin_e: 300000.0  # UTM easting of the MGRS square origin [m]
    mgrs_origin_n: 6100000.0  # UTM northing of the MGRS square origin [m]
    base_link_along_m: 9.873  # published point ahead of antenna 1 along the track [m]
    base_link_height_m: 3.0  # antenna 1 height above rail top [m]
    bogie_base_m: 7.55  # distance between bogie centres (heading chord) [m]
    antenna_baseline_m: 12.436  # antenna 1 -> antenna 2 along the body axis (base_link heading) [m]
    publish_grid_s: 0.05  # fixed stamp grid period (0 = off) [s]
    publish_on_cmd: 1.0  # publish at controller stamps [bool]
    publish_on_wheel: 1.0  # publish at bogie stamps [bool]
    joint_need_both: 1.0  # joint alarm needs both bogies unless the other is out [bool]
    joint_d_tau_s: 20.0  # slow disturbance reference of the joint CUSUM (0 = filter d) [s]
    cmd_check_absolute: 1.0  # controller check on absolute braking accel, paused when wheels bad [bool]
    standstill_exit_no_wheels: 1.0  # leave standstill under traction without wheel data [bool]
    single_bogie_recover: 1.0  # re-anchor to the only live bogie after long rejection [bool]
    agree_tau_s: 2.0  # low-pass time constant of the recovery agreement test (0 = raw) [s]
    d_clamp_model_only: 1.0  # clamp disturbance while both bogies are distrusted [bool]
    lockup_guard_s: 0.0  # time at ~0 after which re-anchoring to 0 is allowed (0 = never) [s]
    stuck_reset: 0.0  # re-anchor to the healthy bogie when the other is declared stuck [bool]
    slide_latch_min_v: 2.0  # no joint slide latch below this filter speed [m/s]
