# Systematic single-factor scenarios for the C++ estimator anomaly suite (run_cpp_suite.py).
# Each scenario isolates ONE anomaly type with FIXED magnitude/duration so the effect of the
# fault (and of a parameter change) can be read directly. Events are >= 35 s apart so the
# 30 s "after" window of one event is not contaminated by the next one.
version: 1
defaults:
  gnss_keep_s: 5.0

scenarios:
  # ---------------------------------------------------------------- joint slip (both bogies)
  - name: X01_joint_slip_step10
    seed: 2001
    tags: [slip, joint, step]
    description: Both bogies over-read by a rectangular +10 % for 5 s under traction (3 events).
    injectors:
      - {type: slip, model: step, bogie: both, peak_rel: 0.10, duration: 5.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  - name: X02_joint_slip_step20
    seed: 2002
    tags: [slip, joint, step]
    description: Both bogies over-read by a rectangular +20 % for 5 s under traction.
    injectors:
      - {type: slip, model: step, bogie: both, peak_rel: 0.20, duration: 5.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  - name: X03_joint_slip_step30
    seed: 2003
    tags: [slip, joint, step]
    description: Both bogies over-read by a rectangular +30 % for 5 s under traction.
    injectors:
      - {type: slip, model: step, bogie: both, peak_rel: 0.30, duration: 5.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  - name: X04_joint_slip_ramp10
    seed: 2004
    tags: [slip, joint, ramp]
    description: Both bogies, trapezoid (30 % ramp up, 40 % hold, 30 % ramp down) to +10 % over 8 s.
    injectors:
      - {type: slip, model: trapezoid, bogie: both, peak_rel: 0.10, duration: 8.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  - name: X05_joint_slip_ramp20
    seed: 2005
    tags: [slip, joint, ramp]
    description: Both bogies, trapezoid to +20 % over 8 s (slow ramp, hardest for an acceleration test).
    injectors:
      - {type: slip, model: trapezoid, bogie: both, peak_rel: 0.20, duration: 8.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  - name: X06_joint_slip_ramp30
    seed: 2006
    tags: [slip, joint, ramp]
    description: Both bogies, trapezoid to +30 % over 8 s.
    injectors:
      - {type: slip, model: trapezoid, bogie: both, peak_rel: 0.30, duration: 8.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  - name: X07_single_slip_step20
    seed: 2007
    tags: [slip, single, step]
    description: One bogie (front or rear) over-reads by a rectangular +20 % for 5 s.
    injectors:
      - {type: slip, model: step, bogie: {front: 0.5, rear: 0.5}, peak_rel: 0.20, duration: 5.0, count: 3, min_hold: 0.5, min_gap: 35.0}
  # ---------------------------------------------------------------- joint slide / lock
  - name: X08_joint_slide_step30
    seed: 2008
    tags: [slide, joint, step]
    description: Both bogies under-read by a rectangular -30 % for 2 s while braking.
    injectors:
      - {type: slide, model: step, bogie: both, depth_rel: 0.30, duration: 2.0, lock_prob: 0.0, count: 3, min_gap: 35.0}
  - name: X09_joint_lock_2s
    seed: 2009
    tags: [slide, lock, joint]
    description: Both bogies read 0 for 2 s while braking at speed (kinematic wheel lock).
    injectors:
      - {type: slide, model: step, bogie: both, lock_prob: 1.0, lock_duration: 2.0, count: 3, min_gap: 35.0}
  # ---------------------------------------------------------------- dropouts (fixed durations)
  - name: X10_drop_wheels_0p5
    seed: 2010
    tags: [dropout, wheels]
    description: Both wheel topics silent for 0.5 s while moving (> 2 m/s), 4 events.
    injectors:
      - {type: dropout, topics: wheels, duration: 0.5, count: 4, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X11_drop_wheels_1
    seed: 2011
    tags: [dropout, wheels]
    description: Both wheel topics silent for 1 s while moving.
    injectors:
      - {type: dropout, topics: wheels, duration: 1.0, count: 4, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X12_drop_wheels_2
    seed: 2012
    tags: [dropout, wheels]
    description: Both wheel topics silent for 2 s while moving.
    injectors:
      - {type: dropout, topics: wheels, duration: 2.0, count: 4, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X13_drop_wheels_5
    seed: 2013
    tags: [dropout, wheels]
    description: Both wheel topics silent for 5 s while moving.
    injectors:
      - {type: dropout, topics: wheels, duration: 5.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X14_drop_wheels_10
    seed: 2014
    tags: [dropout, wheels]
    description: Both wheel topics silent for 10 s while moving.
    injectors:
      - {type: dropout, topics: wheels, duration: 10.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X15_drop_front_5
    seed: 2015
    tags: [dropout, single]
    description: Front wheel topic silent for 5 s while moving.
    injectors:
      - {type: dropout, topics: front, duration: 5.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X16_drop_rear_10
    seed: 2016
    tags: [dropout, single]
    description: Rear wheel topic silent for 10 s while moving.
    injectors:
      - {type: dropout, topics: rear, duration: 10.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X17_drop_cmd_5
    seed: 2017
    tags: [dropout, controller]
    description: Controller topic silent for 5 s while moving (wheels present).
    injectors:
      - {type: dropout, topics: cmd, duration: 5.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X18_drop_vehicle_5
    seed: 2018
    tags: [dropout, all]
    description: All vehicle topics (both wheels + controller) silent for 5 s while moving.
    injectors:
      - {type: dropout, topics: vehicle, duration: 5.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  # ---------------------------------------------------------------- frozen sensors
  - name: X19_frozen_wheels_hold5
    seed: 2019
    tags: [frozen, joint]
    description: Both wheel sensors repeat their last value for 5 s while moving.
    injectors:
      - {type: frozen, topics: wheels, mode: hold, duration: 5.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X20_frozen_front_hold10
    seed: 2020
    tags: [frozen, single]
    description: Front wheel sensor repeats its last value for 10 s while moving.
    injectors:
      - {type: frozen, topics: front, mode: hold, duration: 10.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  - name: X21_frozen_wheels_zero3
    seed: 2021
    tags: [frozen, zero, joint]
    description: Both wheel sensors read exactly 0 for 3 s while moving (> 2 m/s).
    injectors:
      - {type: frozen, topics: wheels, mode: zero, duration: 3.0, count: 3, when: motion, min_speed: 2.0, min_gap: 35.0}
  # ---------------------------------------------------------------- invalid values / outliers
  - name: X22_nan_burst
    seed: 2022
    tags: [invalid, burst]
    description: Bursts of 5-10 consecutive NaN samples (0.5-1 s) on each wheel topic independently.
    injectors:
      - {type: outliers, kinds: {nan: 1.0}, burst: [5, 10], rate: 0.002}
  - name: X23_spikes_only
    seed: 2023
    tags: [outliers, spike]
    description: 1 % isolated additive spikes of +-5..60 km/h on the wheel topics.
    injectors:
      - {type: outliers, kinds: {spike: 1.0}, burst: 1, rate: 0.01}
  # ---------------------------------------------------------------- controller faults
  - name: X24_notch_stuck5
    seed: 2024
    tags: [controller, stuck]
    description: Controller value frozen for 5 s while moving (4-6 events).
    injectors:
      - {type: notch_fault, kinds: {stuck: 1.0}, duration: 5.0, count: [4, 6], min_gap: 20.0}
  - name: X25_notch_offset5
    seed: 2025
    tags: [controller, offset]
    description: Controller value offset by +-1..2 notches for 5 s while moving (4-6 events).
    injectors:
      - {type: notch_fault, kinds: {offset: 1.0}, duration: 5.0, count: [4, 6], min_gap: 20.0}
  - name: X26_notch_jump
    seed: 2026
    tags: [controller, jump]
    description: 1-3 consecutive controller samples replaced by a random notch in [-15, 15] (6 events).
    injectors:
      - {type: notch_fault, kinds: {jump: 1.0}, duration: 1.0, count: 6, min_gap: 10.0}
  # ---------------------------------------------------------------- noise level sweep (natural: ~0.03 km/h)
  - name: X27_noise_both_0p3
    seed: 2027
    tags: [noise, sweep]
    description: White noise sigma 0.3 km/h (10x natural) on both wheel sensors, two 120 s windows.
    injectors:
      - {type: noise, topics: wheels, sigma_kmh: 0.3, count: 2, duration: 120.0, min_gap: 35.0}
  - name: X28_noise_both_0p6
    seed: 2028
    tags: [noise, sweep]
    description: White noise sigma 0.6 km/h (20x natural) on both wheel sensors, two 120 s windows.
    injectors:
      - {type: noise, topics: wheels, sigma_kmh: 0.6, count: 2, duration: 120.0, min_gap: 35.0}
  - name: X29_noise_both_1p2
    seed: 2029
    tags: [noise, sweep]
    description: White noise sigma 1.2 km/h (40x natural) on both wheel sensors, two 120 s windows.
    injectors:
      - {type: noise, topics: wheels, sigma_kmh: 1.2, count: 2, duration: 120.0, min_gap: 35.0}
